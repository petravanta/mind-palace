<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind Palace</title>
<meta name="description" content="Mind maps you lay out by dragging ideas around a canvas, with an outline of the same map that you can edit side by side.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
/* Mind Palace accent: amber */
:root{--accent:#9a6700;--accent-ink:#ffffff;--accent-soft:#f6ecd2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f2c14e;--accent-ink:#2a1d00;--accent-soft:#33280f}}
:root[data-theme="dark"]{--accent:#f2c14e;--accent-ink:#2a1d00;--accent-soft:#33280f}

/* Branch colours: each main branch of a map gets one, and any idea can pick its own */
:root{--b0:#2f6fd0;--b1:#c2306f;--b2:#2e7d32;--b3:#7442b8;--b4:#c2410c;--b5:#0b7285;--b6:#9a6700;--b7:#566771}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b0:#6ea0f0;--b1:#f0679f;--b2:#6fd39a;--b3:#bb94ff;--b4:#fb8a4c;--b5:#5fd0e4;--b6:#f2c14e;--b7:#9fb0ba}}
:root[data-theme="dark"]{--b0:#6ea0f0;--b1:#f0679f;--b2:#6fd39a;--b3:#bb94ff;--b4:#fb8a4c;--b5:#5fd0e4;--b6:#f2c14e;--b7:#9fb0ba}

html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;height:100dvh}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.picker{display:flex;align-items:center;gap:8px;min-width:0}
.picker select{padding:5px 10px;font-size:14px;border-radius:999px;max-width:240px}
nav.tabs .end{margin-left:auto}
@media (min-width:900px){nav.tabs .phone{display:none}}

main.split{flex:1;min-height:0;padding:0;display:grid;grid-template-columns:minmax(280px,34%) minmax(0,1fr)}
.pane{min-height:0;min-width:0;position:relative}
.pane.outline{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
@media (max-width:899px){
  main.split{grid-template-columns:minmax(0,1fr)}
  main.split[data-view="map"] .pane.outline,main.split[data-view="outline"] .pane.map{display:none}
  .pane.outline{border-right:0}
}

/* Toolbars */
.tools{display:flex;gap:4px;align-items:center}
.tools button{border:0;background:none;border-radius:8px;width:36px;height:38px;display:grid;place-items:center;color:var(--ink);flex:none}
.tools button:hover{background:var(--sunk)}
.tools button:disabled{opacity:.35;cursor:default;background:none}
.tools button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tools button svg{width:20px;height:20px}
.tools .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.otools{padding:6px max(8px,env(safe-area-inset-left,0px)) 6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--surface)}
.ctools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 6px 20px rgba(10,16,20,.12);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.ztools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 4px 14px rgba(10,16,20,.08)}
.swatches{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);box-shadow:0 6px 20px rgba(10,16,20,.12);z-index:5}
.swatches button{width:32px;height:32px;border-radius:999px;border:2px solid var(--surface);outline:1px solid var(--line);background:var(--sw)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink)}
.swatches .auto{width:auto;padding:0 12px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--ink)}

/* Canvas */
#canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg);outline:none;cursor:grab}
#canvas.panning{cursor:grabbing}
#canvas .dot{fill:var(--line)}
.link{fill:none;stroke:var(--bc);stroke-width:2;stroke-linecap:round;opacity:.75}
.link.l1{stroke-width:3.2}
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--bc);stroke-width:1.5}
.node text{fill:var(--ink);font:500 14px var(--f-body);text-anchor:middle;dominant-baseline:central}
.node text.ph{fill:var(--faint)}
.node.d1 rect.box{stroke-width:2.5}
.node.d0 rect.box{fill:var(--accent);stroke:none}
.node.d0 text{fill:var(--accent-ink);font-weight:600;font-size:17px}
.node rect.ring{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;display:none}
.node.sel rect.ring{display:block}
.node.d0.sel rect.ring{stroke:var(--ink)}
.node.drop rect.box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.node.drag{opacity:.8;pointer-events:none}
.fold circle{fill:var(--surface);stroke:var(--bc);stroke-width:1.5}
.fold text{font:600 11px var(--f-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.editor{position:absolute;z-index:4;margin:0;resize:none;overflow:hidden;text-align:center;font:500 16px var(--f-body);line-height:1.3;padding:6px 10px;border:2px solid var(--accent);border-radius:9px;background:var(--surface);color:var(--ink);box-shadow:0 6px 20px rgba(10,16,20,.15)}

/* Outline */
.otree{flex:1;overflow:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(8px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.otree ul{list-style:none;margin:0;padding:0}
.otree ul ul{margin-left:17px;padding-left:6px;border-left:1px solid var(--line)}
.orow{display:flex;align-items:center;gap:2px;border-radius:8px;padding-right:4px}
.orow.sel{background:var(--accent-soft)}
.orow .tw{border:0;background:none;width:26px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.orow .tw svg{width:14px;height:14px;transition:transform .12s}
li[aria-expanded="false"]>.orow .tw svg{transform:rotate(-90deg)}
.orow .bul{width:8px;height:8px;border-radius:999px;background:var(--bc);flex:none;margin-right:4px}
li[aria-expanded="false"]>.orow .bul{box-shadow:0 0 0 3px color-mix(in srgb,var(--bc) 30%,transparent)}
.orow{align-items:flex-start}
.orow .tw{height:35px}
.orow .bul{margin-top:13px}
.orow textarea{flex:1;min-width:0;border:0;background:none;padding:6px 4px;font-size:16px;font-weight:500;line-height:1.4;border-radius:6px;resize:none;overflow:hidden;field-sizing:content;min-height:35px;display:block}
.orow textarea:focus{outline:none}
.orow textarea.root{font-family:var(--f-display);font-weight:500;font-size:18px}
.otree>ul>li>.orow{margin-bottom:4px}
.ohint{font-size:12px;color:var(--muted);padding:12px 8px 0;max-width:46ch}
.ohint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--sunk)}
@media (pointer:coarse){.ohint .keys{display:none}}

.toast{display:flex;align-items:center;gap:12px}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.drawer textarea{min-height:140px;font-family:var(--f-mono);font-size:13px}
.drawer .btn.wide{width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.help dt{font-weight:600;margin-top:8px}
.help dd{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 16L6 8M16 16L6 24M16 16L26 9M16 16L26 23" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="6" fill="var(--accent)"/><circle cx="5.5" cy="7.5" r="3.5" fill="var(--accent)" opacity=".55"/><circle cx="5.5" cy="24.5" r="3.5" fill="var(--accent)" opacity=".55"/><circle cx="26.5" cy="8.5" r="3.5" fill="var(--accent)" opacity=".55"/><circle cx="26.5" cy="23.5" r="3.5" fill="var(--accent)" opacity=".55"/></svg>
        Mind Palace
      </div>
      <div class="picker">
        <label class="sr-only" for="mapPick">Mind map</label>
        <select id="mapPick"></select>
      </div>
      <span class="save-state" id="saveState">Saved in this browser</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" class="phone" data-tab="map">Map</button>
      <button type="button" class="phone" data-tab="outline">Outline</button>
      <button type="button" class="end" id="mapBtn">This map</button>
      <button type="button" id="settingsBtn">Settings</button>
    </nav>
  </div>
</header>
<main class="split" id="main" data-view="map">
  <section class="pane outline" aria-label="Outline">
    <div class="tools otools" id="otools"></div>
    <div class="otree" id="otree">
      <ul id="outline" role="tree" aria-label="Outline of the map"></ul>
      <p class="ohint"><span class="keys"><kbd>Enter</kbd> new idea · <kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> move in or out · <kbd>Alt</kbd>+<kbd>↑</kbd><kbd>↓</kbd> reorder · </span>Changes here show on the map straight away.</p>
    </div>
  </section>
  <section class="pane map" id="mapPane" aria-label="Map">
    <svg id="canvas" tabindex="0" aria-label="Mind map canvas. Drag ideas to arrange them; drop one onto another to move it there.">
      <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dot" cx="1" cy="1" r="1"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g id="view"><g id="links"></g><g id="nodes"></g></g>
    </svg>
    <div class="tools ztools" id="ztools"></div>
    <div class="tools ctools" id="ctools"></div>
  </section>
</main>
<div id="layer"></div>
<input type="file" id="fileIn" accept=".json,.md,.markdown,.txt,application/json,text/markdown,text/plain" hidden>
<script>
'use strict';
/* Mind Palace. A map is a tree of ideas: one central idea, each idea with an ordered list of sub-ideas.
   Every idea also has a spot on the canvas (x, y), so the same tree shows two ways that stay in step:
   the canvas, where ideas are dragged around (and dropped onto another idea to move them under it),
   and the outline, where the hierarchy and the order are edited as text.
   User data follows the "User data" section of petravanta/general STANDARDS.md. */

/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID = '326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const KEY = 'mindPalace.data', CUR_KEY = 'mindPalace.current', TAB_KEY = 'mindPalace.tab', VIEW_KEY = 'mindPalace.view';
const LISTS = ['maps'];
const COLORS = 8;
const GAP_X = 56, GAP_Y = 12, GAP_TOP = 26, ROW = 46;   // spacing for Tidy up and for placing new ideas
const FONT = '"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif';

/* Keys on the canvas */
svg.addEventListener('keydown', e => {
  const m = cur(); if (!m || editing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
  if (e.key === '+' || e.key === '=') return zoom(1.25);
  if (e.key === '-') return zoom(0.8);
  if (!sel || !m.nodes[sel]) { if (/^Arrow/.test(e.key) || e.key === 'Enter') { e.preventDefault(); select(m.root, 'map'); } return; }
  const par = parents(m), n = m.nodes[sel];
  if (e.key === 'Tab' || e.key === 'Insert') { e.preventDefault(); return act('child', 'map'); }
  if (e.key === 'Enter') { e.preventDefault(); return act(sel === m.root ? 'child' : 'sibling', 'map'); }
  if (e.key === 'F2' || e.key === ' ') { e.preventDefault(); return openEditor(sel); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return act('delete', 'map'); }
  if (e.key === 'Escape') return select(null, 'map');
  if (/^Arrow/.test(e.key)) {
    e.preventDefault();
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) return act(e.key === 'ArrowUp' ? 'up' : 'down', 'map');
    const kids = n.f ? [] : n.k, p = par[sel], sd = side(m, par, sel);
    let to = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      if (p) { const k = m.nodes[p].k.filter(x => side(m, par, x) === sd).sort((a, b) => m.nodes[a].y - m.nodes[b].y), i = k.indexOf(sel); to = k[i + (e.key === 'ArrowUp' ? -1 : 1)]; }
    } else {
      const outward = (e.key === 'ArrowRight' ? 1 : -1);
      if (sel === m.root) to = kids.find(k => side(m, par, k) === outward);
      else if (outward === sd) to = kids.slice().sort((a, b) => m.nodes[a].y - m.nodes[b].y)[0];
      else to = p;
    }
    if (to) { select(to, 'map'); reveal(to); }
    return;
  }
  if (e.key.length === 1 && !mod && !e.altKey) { e.preventDefault(); return openEditor(sel, false, e.key); }
});

function newMap(rootText, tree) {

/* ---------- Outline text in and out ---------- */
// Reads indented lists and Markdown headings ("# Title", "- idea", "  - sub-idea", "1. idea", tabs or spaces)
function parseOutline(text) {
  const items = [], stack = [];
  for (const raw of String(text).replace(/\r/g, '').split('\n')) {
    if (!raw.trim()) continue;
    const ws = raw.match(/^[\t ]*/)[0].replace(/\t/g, '    ').length;
    let line = raw.trim(), lvl;
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { lvl = h[1].length - 10; line = h[2]; }
    else { lvl = ws; line = line.replace(/^([-*+•–]|\d+[.)])\s+/, '').replace(/^\[[ xX]\]\s+/, ''); }
    line = line.replace(/\*\*(.+?)\*\*/g, '$1').trim();
    if (!line) continue;
    const it = { t: line, kids: [], lvl };
    while (stack.length && stack[stack.length - 1].lvl >= lvl) stack.pop();
    (stack.length ? stack[stack.length - 1].kids : items).push(it);
    stack.push(it);
  }
  return items;
}
function mapFromText(text, fallback) {
  const items = parseOutline(text);
  if (!items.length) return null;
  return items.length === 1 ? newMap(items[0].t, items[0].kids) : newMap(fallback || 'Imported map', items);
}
function toMarkdown(m) {
  const lines = ['# ' + title(m), ''];
  (function w(id, d) { for (const k of m.nodes[id].k) { lines.push('  '.repeat(d) + '- ' + (m.nodes[k].t || 'New idea')); w(k, d + 1); } })(m.root, 0);
  return lines.join('\n') + '\n';
}
function toHTML(m) {
  const list = id => { const k = m.nodes[id].k; return k.length ? '<ul>' + k.map(c => `<li>${esc(m.nodes[c].t || 'New idea')}${list(c)}</li>`).join('') + '</ul>' : ''; };
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title(m))}</title></head><body><h1>${esc(title(m))}</h1>${list(m.root)}</body></html>`;
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const fileName = s => (s.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'Mind map').slice(0, 80);

/* Save as Google Doc: the outline as a real Google Doc (headings and nested bullets) in the user's Drive.
   The first save makes the doc; later saves of the same map update that doc in place. Uses the same drive.file
   permission as Drive sync, so connecting here also turns sync on. */
function driveToken() {
  const t = GoogleToken.get(lsGet('mindPalace.drive.email') || GoogleToken.lastEmail);
  return t && t.token;
}
async function saveGoogleDoc(m) {
  if (!store.configured) return toast('Google Drive is turned off in this copy of the app.');
  try {
    if (!store.known || !store.data) { doc = mergeDocs(doc, await store.load(true)); lsSet(KEY, doc); store.save(doc); renderAll(); m = cur(); }
    else if (!store.live()) await store.signIn();
  } catch (e) { return toast(e && e.code === 'offline' ? 'You seem to be offline.' : 'Couldn’t connect to Google.'); }
  const token = driveToken(); if (!token) return toast('Couldn’t connect to Google.');
  const auth = { Authorization: 'Bearer ' + token }, html = toHTML(m), name = title(m);
  toast('Saving to Google Docs…', 10000);
  try {
    let id = m.gdoc;
    if (id) {
      const r = await fetch(`${DRIVE_API}/drive/v3/files/${id}?fields=id,trashed`, { headers: auth });
      if (!r.ok || (await r.json()).trashed) id = null;
    }
    const b = 'b' + Math.random().toString(36).slice(2);
    const meta = id ? { name } : { name, mimeType: 'application/vnd.google-apps.document' };
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${html}\r\n--${b}--`;
    const r = await fetch(`${DRIVE_API}/upload/drive/v3/files${id ? '/' + id : ''}?uploadType=multipart&fields=id`, { method: id ? 'PATCH' : 'POST', headers: { ...auth, 'Content-Type': 'multipart/related; boundary=' + b }, body });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (m.gdoc !== j.id) { m.gdoc = j.id; changed(m); }
    const url = `https://docs.google.com/document/d/${j.id}/edit`;
    toast('Saved to Google Docs', 8000, { label: 'Open', run: () => window.open(url, '_blank', 'noopener') });
    return url;
  } catch (e) { toast('Couldn’t save to Google Docs. Try again in a moment.'); }
}

/* ===== Google sign-in shared by petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/google-token.js (see STANDARDS.md, "Staying connected to Google Drive").
   Every app lives on petravanta.github.io and uses the same OAuth client, so a Drive token one app gets works in all of them.
   This keeps that token where every app can see it (localStorage key petravanta.google), one per Google account, so
   reconnecting in one app reconnects them all, and an app only ever uses the token of the account it connected with.
   Google gives a static site no refresh token: a token lasts an hour, and getting a new one opens Google's window,
   which browsers only allow right after a tap. With the account's email as a hint, that window closes by itself. */
const GoogleToken=(()=>{
  const KEY='petravanta.google', SCOPE='https://www.googleapis.com/auth/drive.file';
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(e){return {}}};
  const write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
  const subs=[];
  // Another tab or app on this site got a token: let this one pick it up without a tap
  window.addEventListener('storage',e=>{if(e.key===KEY) subs.forEach(f=>{try{f()}catch(_){}})});
  function gis(){return new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej({code:'offline'}); document.head.appendChild(s)})}
  // A token for this account with time left on it, or null
  function get(email){const t=email&&(read().tokens||{})[email]; return t&&t.exp>Date.now()?t:null}
  // o: {clientId, hint:'email to suggest', prompt:'' | 'select_account' | 'consent'}. Call from a tap. Resolves {token, exp, email}.
  function request(o){return new Promise(async(res,rej)=>{
    try{await gis()}catch(e){return rej(e)}
    google.accounts.oauth2.initTokenClient({client_id:o.clientId,scope:SCOPE,login_hint:o.hint||undefined,error_callback:rej,
      callback:async r=>{
        if(r.error) return rej(r);
        const t={token:r.access_token,exp:Date.now()+(Number(r.expires_in||3600)-60)*1000};
        // Which account it is, so the token is filed under the right one
        let email='';
        try{const j=await (await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+t.token}})).json(); email=(j.user&&j.user.emailAddress)||''}catch(e){}
        if(!email) email=o.hint||'';
        if(email){
          const v=read(), now=Date.now(); v.tokens=v.tokens||{};
          for(const k in v.tokens) if(!(v.tokens[k].exp>now)) delete v.tokens[k];
          v.tokens[email]=t; v.last=email; write(v);
        }
        res({...t,email});
      }
    }).requestAccessToken({prompt:o.prompt||''});
  })}
  // Signing out on this browser. Google's permission stays, since the other apps and devices still use it.
  function forget(email){const v=read(); if(v.tokens&&email) delete v.tokens[email]; write(v)}
  return {get,request,forget,gis,onChange:f=>subs.push(f),get lastEmail(){return read().last||''}};
})();
/* ===== end Google sign-in ===== */
/* ===== Drive store: petravanta's apps =====
   Canonical copy: https://github.com/petravanta/general/blob/main/shared/drive-store.js (see STANDARDS.md, "Data lives in Google Drive").
   Needs GoogleToken (shared/google-token.js) inlined above it.
   Keeps an app's data in one JSON file in the user's Google Drive (drive.file scope: the app only sees files it created).
   The browser keeps a copy of the last data, so the app opens straight away even when the hour-long Google sign-in has run out,
   and changes that haven't reached Drive yet (for example while offline). The first tap after that reconnects, merges with
   Drive's copy and saves. */
function DriveStore(o){
  // o: {clientId, file:'App data.json', app:'app-id', key:'localStorage prefix', empty:()=>data, merge:(remote,local)=>data,
  //     onChange:()=>{}, onRemote:data=>{} (Drive's copy changed what the app shows)}
  const API='https://www.googleapis.com';
  const get=k=>{try{return JSON.parse(localStorage.getItem(o.key+'.'+k)||'null')}catch(e){return null}};
  const put=(k,v)=>{try{v==null?localStorage.removeItem(o.key+'.'+k):localStorage.setItem(o.key+'.'+k,JSON.stringify(v));return true}catch(e){return false}};
  const S={token:null,exp:0,email:get('email')||'',fileId:get('file'),known:!!get('known'),data:null,stale:false,busy:false,err:null,last:null,timer:null,ask:0};
  // The app's own token from before tokens were shared; good until it runs out
  const t=get('token'); if(t&&t.exp>Date.now()){S.token=t.token;S.exp=t.exp} put('token',null);
  if(S.known){const c=get('copy')||get('pending'); if(c){S.data=c; S.stale=true}}
  // Load Google's script now: if it only starts loading on the tap, the browser may block its window
  if(o.clientId&&S.known) GoogleToken.gis().catch(()=>{});
  const live=()=>{
    const g=GoogleToken.get(S.email); if(g&&g.exp>S.exp){S.token=g.token;S.exp=g.exp}
    return !!S.token&&Date.now()<S.exp;
  };
  const note=()=>{try{o.onChange&&o.onChange()}catch(e){}};
  // Opens Google's window, so call this from a tap. For an account that already agreed, the window closes by itself.
  // A first connect suggests the account the other apps use; after that, the account this app connected with.
  async function signIn(){
    const r=await GoogleToken.request({clientId:o.clientId,hint:S.email||(S.known?'':GoogleToken.lastEmail),prompt:S.known||GoogleToken.lastEmail?'':'consent'});
    S.token=r.token; S.exp=r.exp; S.known=true; put('known',true);
    if(r.email&&r.email!==S.email){S.email=r.email; put('email',r.email)}
  }
  async function call(path,opt={}){
    if(!live()) throw {code:'expired'};
    let r; try{r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+S.token}})}catch(e){throw {code:'offline'}}
    if(r.status===401){S.token=null; S.exp=0; GoogleToken.forget(S.email); throw {code:'expired'}}
    if(!r.ok) throw {code:'http',status:r.status};
    return r;
  }
  async function find(){
    if(S.fileId){try{const j=await (await call(`/drive/v3/files/${S.fileId}?fields=id,trashed`)).json(); if(!j.trashed) return S.fileId}catch(e){if(e.code!=='http') throw e}}
    const q=encodeURIComponent(`name='${o.file.replace(/'/g,"\\'")}' and trashed=false`);
    const j=await (await call(`/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
    S.fileId=j.files&&j.files[0]?j.files[0].id:null; put('file',S.fileId); return S.fileId;
  }
  async function read(){const id=await find(); return id?(await call(`/drive/v3/files/${id}?alt=media`)).json():null}
  async function write(data){
    const body=JSON.stringify({app:o.app,saved:new Date().toISOString(),...data}), id=await find();
    if(id){await call(`/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
    const b='b'+Math.random().toString(36).slice(2), meta=JSON.stringify({name:o.file,mimeType:'application/json'});
    const j=await (await call('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
      body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})).json();
    S.fileId=j.id; put('file',j.id);
  }
  // Data opened from this browser's copy may be behind Drive's: merge Drive's in before writing over it
  async function catchUp(){
    if(!S.stale) return;
    const remote=await read(); S.stale=false;
    if(!remote) return;
    const before=JSON.stringify(S.data); S.data=o.merge(remote,S.data); put('copy',S.data);
    if(JSON.stringify(S.data)!==before) try{o.onRemote&&o.onRemote(S.data)}catch(e){}
  }
  async function flush(){
    clearTimeout(S.timer); if(!S.data||S.busy) return;
    if(!live()){note();return}
    S.busy=true; note();
    try{await catchUp(); await write(S.data); S.err=null; S.last=new Date(); put('pending',null)}
    catch(e){S.err=e.code==='expired'?null:e.code==='offline'?'offline':'error'}
    finally{S.busy=false; note()}
  }
  // Load: Drive's copy, merged with any changes this browser hadn't saved yet. Creates the file on first use.
  async function load(interactive){
    if(!live()){ if(!interactive) throw {code:'expired'}; await signIn() }
    S.busy=true; note();
    const pending=get('pending');
    try{
      const remote=await read();
      let data=remote?o.merge(remote,o.empty()):o.empty();
      if(pending) data=o.merge(pending,data);
      S.data=data; S.stale=false; S.err=null; S.last=new Date(); put('copy',data);
      if(!remote||pending){await write(data); put('pending',null)}
      return data;
    }catch(e){
      // offline with unsaved changes: carry on from them; they go to Drive once the connection is back
      if(e.code==='offline'&&pending){S.data=o.merge(pending,o.empty()); S.stale=true; S.err='offline'; return S.data}
      S.err=e.code==='offline'?'offline':e.code==='expired'?null:'error'; throw e;
    }finally{S.busy=false; note()}
  }
  // Pick up changes made on another device
  async function refresh(){
    if(!live()||S.busy||!S.data) return false;
    try{const r=await read(); if(!r) return false; const before=JSON.stringify(S.data); S.data=o.merge(r,S.data); S.stale=false; put('copy',S.data); return JSON.stringify(S.data)!==before}
    catch(e){return false}
  }
  function save(data){S.data=data; put('copy',data); if(!put('pending',data)) {/* storage full or blocked: Drive still gets it */} clearTimeout(S.timer); S.timer=setTimeout(flush,1500); note()}
  function signOut(){
    GoogleToken.forget(S.email);
    S.token=null; S.exp=0; S.data=null; S.stale=false; S.email=''; ['known','file','pending','copy','email'].forEach(k=>put(k,null)); S.known=false; note();
  }
  // Tokens last an hour. Renew on a tap when it is close to running out or gone, then save anything waiting.
  document.addEventListener('click',e=>{
    if(!o.clientId||!S.known||e.target.closest('[data-drive]')) return;
    live(); if(S.exp-Date.now()>10*60000||Date.now()-S.ask<60000) return;
    S.ask=Date.now(); signIn().then(flush).catch(()=>note());
  },true);
  // Another app or tab reconnected this account: carry on with its token
  GoogleToken.onChange(()=>{if(S.known&&S.data&&live()) flush(); else note()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') flush()});
  window.addEventListener('online',()=>flush());
  function status(){
    if(!S.data) return '';
    if(S.busy) return 'Saving to Google Drive…';
    const waiting=!!get('pending');
    if(S.err==='offline') return 'Offline · changes save to Drive when you’re back online';
    if(S.err) return 'Couldn’t reach Google Drive · will retry';
    if(!live()) return waiting?'Tap anywhere to save to Google Drive':'Tap anywhere to reconnect Google Drive';
    if(waiting) return 'Saving to Google Drive…';
    return 'Saved to Google Drive'+(S.last?' · '+S.last.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'');
  }
  return {load,save,flush,refresh,signIn,signOut,status,live,
    get data(){return S.data}, get known(){return S.known}, get configured(){return !!o.clientId}, get file(){return o.file},
    get needsTap(){return !!S.data&&!live()}};
}
/* ===== end Drive store ===== */
const store = DriveStore({
  clientId: GOOGLE_CLIENT_ID, file: 'Mind Palace data.json', app: 'mind-palace', key: 'mindPalace.drive',
  empty: blankDoc, merge: (remote, local) => mergeDocs(local, remote),
  onChange: () => { showSaveState(); refreshDrivePanel(); },
  onRemote: data => remoteIn(data)
});
// Drive's copy came in: merge it, and redraw unless that would pull text out from under the person typing
function remoteIn(data) {
  doc = mergeDocs(doc, data); lsSet(KEY, doc);
  if (!cur() && doc.maps[0]) setCurrent(doc.maps[0].id);
  if (editing) return renderPicker();
  const a = document.activeElement, inOutline = a && a.closest && a.closest('#outline');
  renderAll(inOutline && sel ? { id: sel, caret: a.selectionStart } : null);
}
function showSaveState() { $('#saveState').textContent = store.known ? store.status() || 'Saved in this browser' : 'Saved in this browser'; }

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 2600, action) {
  clearTimeout(toastTimer);
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); }; t.appendChild(b); }
  toastTimer = setTimeout(() => t.remove(), ms);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#layer').innerHTML) return closeDrawer();
  if (e.key === 'Escape') closeSwatches();
  // Undo from anywhere that isn't a text field (those handle it themselves)
  const a = document.activeElement;
  if ((e.ctrlKey || e.metaKey) && !/^(INPUT|TEXTAREA)$/.test(a && a.tagName) && a !== svg && !$('#layer').innerHTML) {
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if (k === 'y') { e.preventDefault(); return redo(); }
  }
});
addEventListener('storage', e => { if (e.key === KEY && !editing) { doc = upgrade(lsGet(KEY)); if (!cur() && doc.maps[0]) setCurrent(doc.maps[0].id); renderAll(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.known && store.live() && await store.refresh()) remoteIn(store.data);
});
addEventListener('resize', () => { if (editing) placeEditor(); if (needFit) fit(); });

/* ---------- Start ---------- */
(async () => {
  if (store.known && store.data) doc = mergeDocs(doc, store.data);
  if (!doc.maps.length) { doc.maps.push(welcomeMap()); lsSet(KEY, doc); }
  setCurrent(cur() ? curId : doc.maps[0].id);
  setTab(matchMedia('(max-width:899px)').matches ? tab : 'map');
  $('#main').dataset.view = tab;
  renderAll();
  if (needFit) fit();
  showSaveState();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { MCACHE.clear(); renderCanvas(); });
  if (store.known && store.live()) {
    try { doc = mergeDocs(doc, await store.load(false)); lsSet(KEY, doc); store.save(doc); remoteIn(doc); } catch (e) { showSaveState(); }
  }
})();
</script>
